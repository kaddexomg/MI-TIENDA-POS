<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09131F">
  <title>MI TIENDA ADMIN — Dueño</title>
  <link rel="icon" type="image/png" href="brand-icon.png">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div id="toastBanner" class="toast-banner" role="status" aria-live="polite"></div>

  <!-- PANTALLA 1: BÓVEDA PERSONAL DEL DUEÑO (MISMA IDENTIDAD QUE PC + iOS 26 LIQUID GLASS) -->
  <section id="loginScreen" class="login-screen">
    <div class="pin-lock-wrap">
      <button type="button" id="loginConnPill" class="conn-pill" title="Configurar VPS o red local">
        <span id="loginConnDot" class="conn-dot checking"></span>
        <span id="loginConnLabel">Buscando servidor...</span>
        <svg class="conn-gear-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>

      <div class="pin-brand-head">
        <img src="brand-icon.png" alt="MI TIENDA ADMIN" class="mobile-brand-logo-xl">
        <h1 class="pin-brand-title">MI TIENDA <em>ADMIN</em></h1>
        <p class="pin-brand-sub">Acceso exclusivo del dueño · Ingresa tu PIN</p>
      </div>

      <div id="pinDotsWrap" class="pin-dots-row" aria-label="Indicador de PIN">
        <span class="p-dot"></span>
        <span class="p-dot"></span>
        <span class="p-dot"></span>
        <span class="p-dot"></span>
        <span class="p-dot"></span>
        <span class="p-dot"></span>
      </div>

      <div id="loginErrorMsg" class="pin-error-banner" style="display:none"></div>

      <div class="pin-keypad" role="group" aria-label="Teclado numérico de PIN">
        <button type="button" class="k-btn" data-key="1"><span>1</span></button>
        <button type="button" class="k-btn" data-key="2"><span>2</span></button>
        <button type="button" class="k-btn" data-key="3"><span>3</span></button>
        <button type="button" class="k-btn" data-key="4"><span>4</span></button>
        <button type="button" class="k-btn" data-key="5"><span>5</span></button>
        <button type="button" class="k-btn" data-key="6"><span>6</span></button>
        <button type="button" class="k-btn" data-key="7"><span>7</span></button>
        <button type="button" class="k-btn" data-key="8"><span>8</span></button>
        <button type="button" class="k-btn" data-key="9"><span>9</span></button>
        <button type="button" class="k-btn k-btn-muted" id="openSrvConfigBtn" aria-label="Configurar servidor VPS">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button type="button" class="k-btn" data-key="0"><span>0</span></button>
        <button type="button" class="k-btn k-btn-muted" id="pinBackspaceBtn" aria-label="Borrar dígito">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
        </button>
      </div>

      <div class="pin-foot-actions">
        <button type="button" id="pinSubmitManualBtn" class="pin-enter-btn hidden">Entrar ahora</button>
        <button type="button" id="openSrvLinkBtn" class="pin-srv-link">Configurar VPS o red de tienda</button>
        <button type="button" id="enterOfflinePreviewBtn" class="pin-srv-link" style="color:#34D399">Entrar en vista previa sin servidor</button>
      </div>
    </div>
  </section>

  <!-- PANTALLA 2: SHELL NATIVO iOS 26 LIQUID GLASS CON SWIPE HORIZONTAL -->
  <section id="appShell" class="app-shell hidden">
    <header class="app-header">
      <div class="hdr-left">
        <img src="brand-icon.png" alt="Logo" class="mobile-brand-logo-sm">
        <div class="hdr-title-wrap">
          <h1 id="hdrStoreName">MI TIENDA POS</h1>
          <div class="hdr-sub">
            <span id="hdrStatusDot" class="status-dot"></span>
            <span id="hdrConnText">Sincronizado</span>
          </div>
        </div>
      </div>
      <div class="hdr-right">
        <span id="hdrRatePill" class="rate-glass-pill tabular-nums">BCV —</span>
        <button type="button" id="hdrRefreshBtn" class="icon-glass-btn" aria-label="Actualizar datos">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
      </div>
    </header>

    <!-- SWIPE PAGER DE 5 SECCIONES CON SEGUIMIENTO 1:1 AL DEDO -->
    <main id="pagerViewport" class="pager-viewport">
      <div id="pagerTrack" class="pager-track">
        <section class="pager-page" data-tab="live" id="pane-live"></section>
        <section class="pager-page" data-tab="pagomovil" id="pane-pagomovil"></section>
        <section class="pager-page" data-tab="inventory" id="pane-inventory"></section>
        <section class="pager-page" data-tab="ai" id="pane-ai"></section>
        <section class="pager-page" data-tab="control" id="pane-control"></section>
      </div>
    </main>

    <!-- DOCK FLOTANTE iOS 26 LIQUID GLASS CON CÁPSULA DESLIZABLE -->
    <nav class="liquid-dock-wrap" aria-label="Navegación administrativa">
      <div class="liquid-dock" id="liquidDock">
        <div class="dock-active-pill" id="dockActivePill" aria-hidden="true"></div>
        <button type="button" class="dock-btn active" data-tab="live" data-index="0">
          <svg class="dock-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Mi Día</span>
        </button>
        <button type="button" class="dock-btn" data-tab="pagomovil" data-index="1">
          <svg class="dock-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
          <span>Pago Móvil</span>
          <span id="pmNavBadge" class="tab-badge hidden">0</span>
        </button>
        <button type="button" class="dock-btn" data-tab="inventory" data-index="2">
          <svg class="dock-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          <span>Inventario</span>
        </button>
        <button type="button" class="dock-btn" data-tab="ai" data-index="3">
          <svg class="dock-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          <span>IA Costos</span>
        </button>
        <button type="button" class="dock-btn" data-tab="control" data-index="4">
          <svg class="dock-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span>Control</span>
        </button>
      </div>
    </nav>
  </section>

  <!-- BOTTOM SHEET LIQUID GLASS ARRASTRABLE HACIA ABAJO -->
  <div id="sheetBackdrop" class="sheet-backdrop">
    <div id="sheetPanel" class="sheet-panel" role="dialog" aria-modal="true">
      <div id="sheetDragZone" class="sheet-drag-zone">
        <div class="sheet-handle"></div>
        <div class="sheet-hd">
          <h3 id="sheetTitle">Acción</h3>
          <button type="button" id="sheetCloseBtn" class="sheet-close-btn" aria-label="Cerrar">✕</button>
        </div>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <script src="mobile.js"></script>
</body>
</html>
