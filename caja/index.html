<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets de Comida y Resumen de Turno | Caja Rápida</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body>
  <div class="admin-wrap">
    <aside class="admin-aside" id="adminAside"></aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggleBtn">☰</button>
          <div class="topbar-title">
            <h2>Tickets de Comida y Resumen de Turno de Caja</h2>
            <p>Consulta rápida de órdenes despachadas, métodos de cobro y vueltos entregados hoy</p>
          </div>
        </div>
        <div class="topbar-right">
          <span class="topbar-rate-pill" id="topRatePill">BCV: —</span>
          <a href="pos.html" class="btn btn-p">Volver a Cobrar (POS)</a>
        </div>
      </header>

      <div class="admin-content">
        <div class="stat-grid" id="cajaTurnStats"></div>

        <div class="card">
          <div class="card-hd">
            <h3>Tickets Recientes Emitidos por Caja</h3>
          </div>
          <div class="table-wrap" style="max-height:calc(100vh - 190px);overflow-y:auto">
            <table class="data-table">
              <thead style="position:sticky;top:0;z-index:5">
                <tr>
                  <th>Nº Orden</th>
                  <th>Cliente / Hora</th>
                  <th>Platos y Productos</th>
                  <th>Total Cobrado</th>
                  <th>Método de Pago</th>
                  <th>Vuelto Entregado</th>
                </tr>
              </thead>
              <tbody id="cajaTurnTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/tax.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/rates.js"></script>
  <script src="../assets/js/permissions.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/sidenav.js"></script>
  <script>
    function renderCajaTurn() {
      const sales = MTP.state.sales;
      const bcv = MTP.state.settings.rateBcv;
      const totalUsd = sales.reduce((acc, s) => acc + s.totalUsd, 0);
      const totalChangeUsd = sales.reduce((acc, s) => acc + (s.changeGiven?.totalChangeUsd || 0), 0);

      const receiptIco = window.MTPIcons ? MTPIcons.get('receipt', { size: 16 }) : '';
      const cashIco = window.MTPIcons ? MTPIcons.get('cash', { size: 16 }) : '';
      const refreshIco = window.MTPIcons ? MTPIcons.get('refresh', { size: 16 }) : '';

      document.getElementById('cajaTurnStats').innerHTML = `
        <div class="stat-card">
          <div class="stat-ico green">${receiptIco}</div>
          <div>
            <div class="stat-n">${sales.length} tickets</div>
            <div class="stat-l">Órdenes Despachadas en Turno</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-ico blue">${cashIco}</div>
          <div>
            <div class="stat-n">${MTP.fmtUSD(totalUsd)}</div>
            <div class="stat-l">Total Facturado en Caja</div>
            <div class="stat-sub">${(totalUsd * bcv).toFixed(2)} Bs</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-ico yellow">${refreshIco}</div>
          <div>
            <div class="stat-n">${MTP.fmtUSD(totalChangeUsd)}</div>
            <div class="stat-l">Total Vueltos Entregados</div>
            <div class="stat-sub">${(totalChangeUsd * bcv).toFixed(2)} Bs</div>
          </div>
        </div>
      `;

      document.getElementById('cajaTurnTable').innerHTML = sales.map(s => `
        <tr>
          <td><span class="code-pill plu">#${s.orderNumber}</span></td>
          <td>
            <strong>${s.customer}</strong>
            <div style="font-size:11.5px;color:var(--txt-muted)">${new Date(s.createdAt).toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' })}</div>
          </td>
          <td>${s.items.map(i => `<div>• <strong>${i.qty} ${i.unit}</strong> ${i.name}</div>`).join('')}</td>
          <td>
            <div class="price-dual">
              <span class="price-usd">${MTP.fmtUSD(s.totalUsd)}</span>
              <span class="price-bs">${MTP.fmtBsRaw(s.totalBs)}</span>
            </div>
          </td>
          <td>${(s.payments || []).map(p => `
            <div style="margin-bottom:2px">
              <span class="badge ${p.method === 'Pago Móvil' ? 'badge-blue' : (p.method === 'Punto de Venta' ? 'badge-green' : 'badge-yellow')}">
                ${p.method}: ${MTP.fmtUSD(p.amountUsd)} (${p.amountBs?.toFixed(2) || '0.00'} Bs)
              </span>
              ${p.terminalName ? `<span class="badge badge-purple" style="font-size:9.5px">${p.terminalName} (Lote ${p.lote || '—'})</span>` : ''}
              ${p.destAccountName ? `<span class="badge badge-amber" style="font-size:9.5px">${p.destAccountName}</span>` : ''}
              ${p.ref ? `<span class="code-pill" style="font-size:9.5px">Ref: ${p.ref}</span>` : ''}
            </div>
          `).join('')}</td>
          <td>
            <strong>${MTP.fmtUSD(s.changeGiven?.totalChangeUsd || 0)}</strong>
            <div style="font-size:11px;color:var(--txt-sec)">${s.changeGiven?.breakdown || 'Exacto'}</div>
          </td>
        </tr>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderCajaTurn);
    window.addEventListener('mtp:state-updated', renderCajaTurn);
  </script>
</body>
</html>
