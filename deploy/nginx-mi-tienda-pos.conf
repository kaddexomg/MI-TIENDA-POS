# ============================================================================
# Nginx VirtualHost Aislado para MI-TIENDA-POS (Coexistencia Segura con JJ Paper)
# Ubicación en el VPS: /etc/nginx/sites-available/mi-tienda-pos
# ============================================================================
# IMPORTANTE:
# - Reemplazar POS_DOMAIN por el subdominio real (ej. pos.tudominio.com)
# - Este bloque escucha únicamente por ese server_name y redirige al puerto
#   interno 7070, sin tocar ni interferir con el bloque de JJ Paper.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name POS_DOMAIN;

    # Tamaño máximo de cuerpo para respaldos JSON y sincronización de lotes
    client_max_body_size 15M;

    # Compresión ligera para conexión móvil rápida
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # SSE en tiempo real para Caja, Admin y App Móvil (sin buffering)
    location ~ ^/api(/v1)?/stream {
        proxy_pass http://127.0.0.1:7070;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:7070;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
